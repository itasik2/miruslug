name: MirUslug 2 CI

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "modern-next/**"
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "tsconfig.base.json"
      - ".github/workflows/miruslug-2-ci.yml"
  pull_request:
    paths:
      - "modern-next/**"
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "tsconfig.base.json"
      - ".github/workflows/miruslug-2-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: miruslug
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d miruslug"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/miruslug
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run prisma:deploy
      - run: npm run build
